# Diagnostic ponctuel, lecture seule (à supprimer après usage).
name: Diagnostic hébergement
on:
  push:
    branches: [claude/continue-project-W12qw]
    paths: [.github/workflows/diag-hebergement.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Quelle version sert athletikhub.netlify.app ?
        run: |
          B=https://athletikhub.netlify.app
          curl -sS -m 30 "$B/index.html" -o /tmp/i
          echo "taille index.html : $(wc -c < /tmp/i)"
          for m in 'RÉSISTANCE MENTALE' 'AH_API_BASE' 'bkMarksOv' 'sb-vide' 'firebase-cloud-messaging-push-scope'; do
            printf '%-40s %s\n' "$m" "$(grep -c "$m" /tmp/i)"
          done
          curl -sS -m 30 "$B/sw.js" | grep -m1 "const CACHE" || echo "(sw.js sans CACHE)"
      - name: Contrôle complet de athletikhub.netlify.app
        run: bash scripts/verify-prod.sh https://athletikhub.netlify.app || true
